name: Build & Publish
on:
  push:
    branches:
      - "main"
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  create-release:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: write
      id-token: write
    outputs:
      tag: ${{ steps.create-tag.outputs.tag }}
      version: ${{ steps.create-tag.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: '0' # Fetch all history for tags

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create tag and release
        id: create-tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          COMMIT_SHA="$(git rev-parse HEAD)"
          # Most recent tag, or bootstrap from package.json when none exist yet.
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "$PREVIOUS_TAG" ]; then
            BASE_VERSION="${PREVIOUS_TAG#v}"
          else
            BASE_VERSION="$(node -p "require('./package.json').version")"
          fi
          NEXT_VERSION="$(node .github/scripts/generate-version "$BASE_VERSION" patch)"
          TAG="v${NEXT_VERSION}"
          echo "Bumping $BASE_VERSION -> $TAG at commit $COMMIT_SHA"
          git tag "$TAG" "$COMMIT_SHA"
          git push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Create release
        shell: bash
        run: |
          gh release create "${{ steps.create-tag.outputs.tag }}" \
            --title "${{ steps.create-tag.outputs.tag }}" \
            --notes "Automated release for latest commit after merge"
  build-and-test:
    name: build-and-test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Coverage
        if: matrix.node-version == '22'
        run: npm run coverage

      - name: Build
        run: npm run build

      - name: Smoke-test built CLI
        run: |
          node dist/index.js help
          CODECRAWLER_DB="$(mktemp -u).db" node dist/index.js status
  build-and-publish:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    needs:
      - create-release
      - build-and-test
    environment:
      name: npmjs-publish
      url: https://www.npmjs.com/package/@nithin554/code-crawler
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: '0' # Fetch all history for tags

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          # Publishing uses OIDC trusted publishing (no token secret), which
          # needs npm >= 11.5.1. The Node 22 line still bundles npm 10.x, and an
          # older CLI publishes unauthenticated, which the registry answers
          # with a bare 404 instead of a 401. Node 24 bundles npm 11.x.
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: 'npm'

      - name: Verify npm supports trusted publishing
        shell: bash
        run: |
          set -euo pipefail
          NEED="11.5.1"
          HAVE="$(npm --version)"
          echo "npm $HAVE (need >= $NEED for OIDC trusted publishing)"
          if [ "$(printf '%s\n%s\n' "$NEED" "$HAVE" | sort -V | head -1)" != "$NEED" ]; then
            echo "::error::npm $HAVE predates trusted publishing; pin a newer Node or install npm >= $NEED"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set package version
        shell: bash
        run: npm version "${{ needs.create-release.outputs.version }}" --no-git-tag-version

      - name: Publish package to npm
        shell: bash
        env:
          PKG: '@nithin554/code-crawler'
          VERSION: ${{ needs.create-release.outputs.version }}
        # Trusted publishing (OIDC): no token needed. Requires "Trusted
        # Publishing" to be enabled for the package on npmjs.com.
        run: |
          set -euo pipefail

          published() {
            npm view "$PKG@$VERSION" version >/dev/null 2>&1
          }

          if published; then
            echo "$PKG@$VERSION is already on npm; nothing to publish."
            exit 0
          fi

          # The provenance flow uploads to the Rekor transparency log before
          # the registry upload and reports an "equivalent entry already
          # exists" 409 as fatal when an upload is retried after a timeout.
          # That, and ordinary registry hiccups, are transient: retry, and
          # treat "version is now on npm" as success.
          for attempt in 1 2 3; do
            echo "npm publish attempt $attempt"
            if npm publish --provenance --access public; then
              exit 0
            fi
            echo "::warning::npm publish attempt $attempt failed"
            if published; then
              echo "$PKG@$VERSION reached npm despite the error; continuing."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 15))
            fi
          done

          echo "::error::could not publish $PKG@$VERSION to npm after 3 attempts"
          exit 1

  publish-mcp-registry:
    runs-on: ubuntu-latest
    needs:
      - create-release
      - build-and-publish
    if: github.actor != 'dependabot[bot]'
    # The environment's deployment branch policy allows only `main`, so this
    # job cannot publish from another ref.
    environment:
      name: mcp-registry-publish
      url: https://registry.modelcontextprotocol.io
    permissions:
      contents: read
      id-token: write # Required for the registry's GitHub OIDC login
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.create-release.outputs.tag }}

      - name: Set version in server.json
        shell: bash
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          set -euo pipefail
          # server.json in the repo tracks the next local version; the release
          # version is only known here, so pin it to the npm release.
          VERSION="$VERSION" node -e '
            const fs = require("node:fs");
            const version = process.env.VERSION;
            const server = JSON.parse(fs.readFileSync("server.json", "utf8"));
            server.version = version;
            for (const pkg of server.packages ?? []) pkg.version = version;
            fs.writeFileSync("server.json", JSON.stringify(server, null, 2) + "\n");
          '
          echo "server.json pinned to $VERSION"

      # Skips versions already listed and retries transient registry/npm
      # failures, so this job can be re-run on its own after an outage.
      - name: Publish to MCP Registry
        uses: ExaDev/mcp-registry-publish@v1.0.7
        with:
          server-json: server.json