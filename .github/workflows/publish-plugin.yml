name: Publish Plugin to ClawHub

# Publishes plugins/code-crawler with the official openclaw/clawhub reusable
# workflow, so the publish path is the one ClawHub maintains rather than a copy
# of it kept in this repository.
#
# The bundle is Claude-format (it carries a `.claude-plugin/plugin.json`), which
# upstream classifies as the `bundle-plugin` family. That family is the only one
# ClawHub can publish without requiring `openclaw.plugin.json` and a matching
# build output in the bundle, which is why the payload is a thin manifest rather
# than the crawler itself: the plugin resolves its server through
# `npx -y @nithin554/code-crawler`, so the npm release supplies the code. The
# bundle does carry a `package.json`, because ClawHub reports "package metadata
# is missing" without one and cannot build a ClawPack tarball from it.
#
# "Build & Publish" tags every push to main and calls this one with that tag, so
# the plugin version tracks the npm release. `workflow_dispatch` publishes by
# hand (dry run by default) and is how a previously failed publish is retried.
#
# Pinned to a release tag because upstream has no `v1` floating ref. One tag
# serves both workflows: skill-publish first appears in v0.23.0, and
# package-publish only understands `.claude-plugin` bundles from v0.24.0 on
# (v0.12.0 wanted an `openclaw.bundle.json`), so v0.24.1 is the oldest tag that
# publishes everything this repository ships.
#
# Requires a CLAWHUB_TOKEN repository secret, not an environment secret. Upstream
# reads it under the name `clawhub_token`, so it is renamed at this boundary;
# `secrets: inherit` would not rename it. An environment secret cannot be used
# here: only a job that declares the environment can read one, and a `uses:` job
# cannot declare one. Forwarding the value through a job output does not work
# either - GitHub refuses to emit a secret-valued output and warns `Skip output
# '<name>' since it may contain secret` - so the secret has to be repository-wide.
#
# The publish is gated on the `clawhub-publish` environment, whose deployment
# branch policy allows only `main`. A `uses:` job cannot declare an environment,
# so the gate is a separate `guard` job that everything else depends on.

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.1.68"
        type: string
        required: true
      dry_run:
        description: "Validate the bundle without publishing it"
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.1.68"
        type: string
        required: true
      dry_run:
        description: "Validate the bundle without publishing it"
        type: boolean
        required: false
        default: true

permissions: {}

jobs:
  # The `clawhub-publish` environment only allows deployments from `main`, so a
  # dispatch from a branch or tag stops here instead of writing to the registry.
  # This is its own job because a job that calls a reusable workflow cannot
  # declare an environment, and the gate has to sit in front of the publish.
  guard:
    name: guard
    runs-on: ubuntu-latest
    environment: clawhub-publish
    permissions: {}
    steps:
      - name: Confirm this ref may publish
        shell: bash
        run: echo "Publishing from ${GITHUB_REF}"

  # The reusable workflow takes the version as a plain string and cannot strip a
  # leading `v` itself, and no expression function does that, so the tag is
  # normalised in a throwaway job before the publish job can run.
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Derive the package version from the tag
        id: version
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?(\+[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::cannot derive a package version from tag '$TAG'"
            exit 1
          fi
          echo "Publishing plugins/code-crawler@$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # ClawHub needs a `package.json` in the bundle to inspect it and to build a
  # ClawPack tarball, but its `version` changes with every release, so the
  # committed file holds a placeholder and the release version is stamped here.
  # The stamping has to happen in this workflow: the reusable workflow checks the
  # repository out again, so edits made before the call would not reach it. The
  # stamped bundle is therefore packed into a tarball and handed over as an
  # artifact, which upstream publishes instead of the folder.
  pack:
    name: pack
    needs:
      - guard
      - prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.checkout.outputs.commit }}
    steps:
      # The tag rather than the dispatched ref, so a retry of an older release
      # packs the tree that release was cut from.
      - name: Check out the release tag
        id: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - name: Stamp the release version into the bundle
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          node -e '
          const fs = require("node:fs");
          const file = "plugins/code-crawler/package.json";
          const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
          pkg.version = process.env.VERSION;
          fs.writeFileSync(file, `${JSON.stringify(pkg, null, 2)}\n`);
          '
          grep -q "\"version\": \"$VERSION\"" plugins/code-crawler/package.json
      # `npm pack` output is exactly the "gzip-compressed npm pack tarball" that
      # upstream's ClawPack parser expects, and packing here is what upgrades the
      # release from the legacy ZIP that ClawHub flags as not ClawPack.
      - name: Pack the stamped bundle
        run: |
          set -euo pipefail
          mkdir -p dist
          npm pack ./plugins/code-crawler --pack-destination dist
      # The publish job resolves the only `.tgz` in the artifact, so the name of
      # the file does not have to be restated there.
      - name: Upload the packed bundle
        uses: actions/upload-artifact@v7
        with:
          name: clawhub-plugin-package
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish
    needs:
      - guard
      - prepare
      - pack
    # No `v1` ref exists upstream, so a release tag is the only pinnable ref.
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@v0.24.1
    # A called workflow can only narrow the caller's token, so every grant the
    # upstream workflow needs has to be made here: it reads this run's artifacts,
    # checks the repository out, and mints the OIDC token it pins its own CLI
    # source with.
    permissions:
      actions: read
      contents: read
      id-token: write
    # Never cancel a run that is mid-upload.
    concurrency:
      group: clawhub-publish-plugin
      cancel-in-progress: false
    with:
      # Upstream publishes the `package_artifact_name` tarball and ignores this
      # once the artifact resolves; it stays named so the bundle path is still
      # visible here and the folder form remains the fallback.
      source: ./plugins/code-crawler
      package_artifact_name: clawhub-plugin-package
      family: bundle-plugin
      owner: nithin554
      version: ${{ needs.prepare.outputs.version }}
      tags: latest
      changelog: ${{ format('Release {0}', inputs.tag) }}
      topics: code-analysis,call-graph,static-analysis,mcp,dead-code
      # An artifact publish cannot infer this, so the release is attributed to
      # the commit and tag the tarball was packed from.
      source_repo: ${{ github.repository }}
      source_commit: ${{ needs.pack.outputs.commit }}
      source_ref: ${{ format('refs/tags/{0}', inputs.tag) }}
      dry_run: ${{ inputs.dry_run }}
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}

  # The registry answers a burst of writes with "Too many writes in a short
  # period of time", and upstream makes exactly one attempt, so a throttle would
  # otherwise turn into a failed release. One retry outlasts the advertised
  # reset window; a dry run never writes, so it never needs one.
  publish-retry:
    name: publish (retry)
    needs:
      - guard
      - prepare
      - pack
      - publish
    # Only a failed publish is worth retrying; a failed `prepare` already
    # reported the bad tag and would just fail again.
    if: needs.publish.result == 'failure' && !inputs.dry_run
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@v0.24.1
    permissions:
      actions: read
      contents: read
      id-token: write
    concurrency:
      group: clawhub-publish-plugin
      cancel-in-progress: false
    with:
      source: ./plugins/code-crawler
      package_artifact_name: clawhub-plugin-package
      family: bundle-plugin
      owner: nithin554
      version: ${{ needs.prepare.outputs.version }}
      tags: latest
      changelog: ${{ format('Release {0}', inputs.tag) }}
      topics: code-analysis,call-graph,static-analysis,mcp,dead-code
      source_repo: ${{ github.repository }}
      source_commit: ${{ needs.pack.outputs.commit }}
      source_ref: ${{ format('refs/tags/{0}', inputs.tag) }}
      dry_run: false
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}
