name: Publish Plugin to ClawHub

# Publishes plugins/code-crawler to ClawHub as a ClawPack tarball, using the
# official `clawhub` CLI pinned to the release the skill workflow calls.
#
# This used to delegate to openclaw/clawhub's `package-publish.yml` reusable
# workflow, which cannot publish a bundle that carries a `package.json` - and
# this one needs one, because ClawHub reports "package metadata is missing"
# without it and cannot build a ClawPack from it. Upstream inspects the bundle
# with `bun ... package validate`, the CLI refuses that command under Bun ("Plugin
# validation requires Node.js 22.13+ (22.x) or 24+"), and a ClawPack always
# contains `package/package.json` - upstream strips exactly one leading segment
# before inspecting - so the step always runs, always fails, and no input skips
# it. Vendoring the workflow does not help either: it resolves its own CLI source
# from the OIDC `job_workflow_ref`, so a copy kept here would clone this
# repository as the CLI. The CLI is therefore invoked directly, under Node, on
# the tarball that `pack` builds.
#
# The bundle is Claude-format (it carries a `.claude-plugin/plugin.json`), which
# upstream classifies as the `bundle-plugin` family. That family is the only one
# ClawHub can publish without requiring `openclaw.plugin.json` and a matching
# build output in the bundle, which is why the payload is a thin manifest rather
# than the crawler itself: the plugin resolves its server through
# `npx -y @nithin554/code-crawler`, so the npm release supplies the code.
#
# "Build & Publish" tags every push to main and calls this one with that tag, so
# the plugin version tracks the npm release. `workflow_dispatch` publishes by
# hand (dry run by default) and is how a previously failed publish is retried.
#
# The CLI reads its credentials from the JSON file named by CLAWHUB_CONFIG_PATH
# and has no token environment variable, so the secret is written into that file
# for the length of the job. The publishing jobs declare the `clawhub-publish`
# environment, whose deployment branch policy allows only `main`, so nothing
# else in the repository can reach the registry.

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.1.68"
        type: string
        required: true
      dry_run:
        description: "Validate the bundle without publishing it"
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.1.68"
        type: string
        required: true
      dry_run:
        description: "Validate the bundle without publishing it"
        type: boolean
        required: false
        default: true

permissions: {}

# Upstream has no floating `v1` ref, so the CLI is pinned to the same release
# tag the skill workflow calls.
env:
  CLAWHUB_CLI_VERSION: "0.24.1"

jobs:
  # The `clawhub-publish` environment only allows deployments from `main`, so a
  # dispatch from a branch or tag stops here instead of building a release
  # bundle. The publishing jobs declare the environment as well, because that is
  # what grants them the credential.
  guard:
    name: guard
    runs-on: ubuntu-latest
    environment: clawhub-publish
    permissions: {}
    steps:
      - name: Confirm this ref may publish
        shell: bash
        run: echo "Publishing from ${GITHUB_REF}"

  # The CLI is told the version explicitly, and no expression function strips a
  # leading `v`, so the tag is normalised in a throwaway job first.
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Derive the package version from the tag
        id: version
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?(\+[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::cannot derive a package version from tag '$TAG'"
            exit 1
          fi
          echo "Publishing plugins/code-crawler@$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # ClawHub needs a `package.json` in the bundle to inspect it and to build a
  # ClawPack tarball, but its `version` changes with every release, so the
  # committed file holds a placeholder and the release version is stamped here.
  # The stamping has to happen in this workflow rather than before the call,
  # because the tag is checked out here, so the stamped bundle is packed into a
  # tarball that the publish job consumes.
  pack:
    name: pack
    needs:
      - guard
      - prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.checkout.outputs.commit }}
    steps:
      # The tag rather than the dispatched ref, so a retry of an older release
      # packs the tree that release was cut from.
      - name: Check out the release tag
        id: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - name: Stamp the release version into the bundle
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          node -e '
          const fs = require("node:fs");
          const file = "plugins/code-crawler/package.json";
          const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
          pkg.version = process.env.VERSION;
          fs.writeFileSync(file, `${JSON.stringify(pkg, null, 2)}\n`);
          '
          grep -q "\"version\": \"$VERSION\"" plugins/code-crawler/package.json
      # `npm pack` output is exactly the "gzip-compressed npm pack tarball" that
      # the ClawPack parser expects, and packing here is what upgrades the
      # release from the legacy ZIP that ClawHub flags as not ClawPack.
      - name: Pack the stamped bundle
        run: |
          set -euo pipefail
          mkdir -p dist
          npm pack ./plugins/code-crawler --pack-destination dist
      # The publish job resolves the only `.tgz` in the artifact, so the name of
      # the file does not have to be restated there.
      - name: Upload the packed bundle
        uses: actions/upload-artifact@v7
        with:
          name: clawhub-plugin-package
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish
    needs:
      - guard
      - prepare
      - pack
    runs-on: ubuntu-latest
    environment: clawhub-publish
    # A failed first attempt is not a failed release while the retry is still
    # available, so the upload step tolerates its own failure and reports it
    # here. A dry run has no retry behind it, so it keeps failing loudly.
    outputs:
      result: ${{ steps.publish.outcome }}
    # The registry is only written through the credential in the environment,
    # so the job itself needs nothing beyond reading this run's artifact.
    permissions:
      contents: read
      actions: read
    # Never cancel a run that is mid-upload.
    concurrency:
      group: clawhub-publish-plugin
      cancel-in-progress: false
    steps:
      # The CLI requires Node.js 22.13+ or 24+ and refuses to run under Bun, so
      # the runtime is pinned instead of inherited from the runner image.
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Download the packed bundle
        uses: actions/download-artifact@v8
        with:
          name: clawhub-plugin-package
          path: dist
      - name: Write the ClawHub config
        shell: bash
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          set -euo pipefail
          node -e '
          const fs = require("node:fs");
          const file = `${process.env.RUNNER_TEMP}/clawhub-config.json`;
          const config = { registry: "https://clawhub.ai", token: process.env.CLAWHUB_TOKEN };
          fs.writeFileSync(file, `${JSON.stringify(config, null, 2)}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `CLAWHUB_CONFIG_PATH=${file}\n`);
          '
      - name: Publish the bundle
        id: publish
        shell: bash
        # Tolerated for a release so the retry can take over; a dry run has no
        # retry, so a failure there must still fail the run.
        continue-on-error: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ needs.pack.outputs.commit }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          # A relative `dist/x.tgz` parses as a GitHub `owner/repo` shorthand, so
          # the CLI is given an absolute path and reads it as a tarball.
          mapfile -t tarballs < <(find "$PWD/dist" -maxdepth 1 -name '*.tgz')
          if [[ ${#tarballs[@]} -ne 1 ]]; then
            echo "::error::expected exactly one packed bundle, found ${#tarballs[@]}"
            exit 1
          fi
          args=(
            package publish "${tarballs[0]}"
            --family bundle-plugin
            --owner nithin554
            --version "$VERSION"
            --tags latest
            --changelog "Release $TAG"
            --topics code-analysis,call-graph,static-analysis,mcp,dead-code
            --source-repo "$GITHUB_REPOSITORY"
            --source-commit "$COMMIT"
            --source-ref "refs/tags/$TAG"
            --wait
            --wait-timeout 1800
            --json
          )
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          npx --yes "clawhub@$CLAWHUB_CLI_VERSION" "${args[@]}"

  # The registry answers a burst of writes with "Too many writes in a short
  # period of time", so a throttle would otherwise turn into a failed release.
  # One retry outlasts the advertised reset window; a dry run never writes, so
  # it never needs one.
  publish-retry:
    name: publish (retry)
    needs:
      - guard
      - prepare
      - pack
      - publish
    # Only a failed upload is worth retrying; a failed `prepare` already
    # reported the bad tag and would just fail again. The publish job tolerates
    # its step failure to keep the run alive, so it reports it through
    # `outputs.result` rather than failing the job.
    if: needs.publish.outputs.result == 'failure' && !inputs.dry_run
    runs-on: ubuntu-latest
    environment: clawhub-publish
    permissions:
      contents: read
      actions: read
    concurrency:
      group: clawhub-publish-plugin
      cancel-in-progress: false
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Download the packed bundle
        uses: actions/download-artifact@v8
        with:
          name: clawhub-plugin-package
          path: dist
      - name: Write the ClawHub config
        shell: bash
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          set -euo pipefail
          node -e '
          const fs = require("node:fs");
          const file = `${process.env.RUNNER_TEMP}/clawhub-config.json`;
          const config = { registry: "https://clawhub.ai", token: process.env.CLAWHUB_TOKEN };
          fs.writeFileSync(file, `${JSON.stringify(config, null, 2)}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `CLAWHUB_CONFIG_PATH=${file}\n`);
          '
      - name: Publish the bundle
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ needs.pack.outputs.commit }}
        run: |
          set -euo pipefail
          # A relative `dist/x.tgz` parses as a GitHub `owner/repo` shorthand, so
          # the CLI is given an absolute path and reads it as a tarball.
          mapfile -t tarballs < <(find "$PWD/dist" -maxdepth 1 -name '*.tgz')
          if [[ ${#tarballs[@]} -ne 1 ]]; then
            echo "::error::expected exactly one packed bundle, found ${#tarballs[@]}"
            exit 1
          fi
          npx --yes "clawhub@$CLAWHUB_CLI_VERSION" \
            package publish "${tarballs[0]}" \
            --family bundle-plugin \
            --owner nithin554 \
            --version "$VERSION" \
            --tags latest \
            --changelog "Release $TAG" \
            --topics code-analysis,call-graph,static-analysis,mcp,dead-code \
            --source-repo "$GITHUB_REPOSITORY" \
            --source-commit "$COMMIT" \
            --source-ref "refs/tags/$TAG" \
            --wait \
            --wait-timeout 1800 \
            --json