name: Publish Skill to ClawHub

# Publishes skills/code-crawler to clawhub.ai at the version of a release tag.
#
# The "Build & Publish" workflow tags every push to main and calls this one with
# that tag, so the skill version always matches the npm package and the MCP
# registry entry for the same commit. The skill is published from the tag
# itself, not from main, so a re-run reproduces exactly what was released.
#
# `workflow_dispatch` re-publishes an existing tag by hand (defaults to the
# latest release) and is how a previously failed publish is retried.
#
# Requires a CLAWHUB_TOKEN repository secret (`clawhub login` then `clawhub token`).
# Without the secret the job reports a notice and exits successfully, so forks
# and fresh clones are not broken by a missing credential.

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.1.66"
        type: string
        required: true
      dry_run:
        description: "Validate the skill without publishing it"
        type: boolean
        default: false
    secrets:
      CLAWHUB_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (empty uses the latest release)"
        type: string
        required: false
      dry_run:
        description: "Validate the skill without publishing it"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One publish at a time; never cancel a run that is mid-upload.
    concurrency:
      group: clawhub-publish
      cancel-in-progress: false
    steps:
      # The version comes from the release tag, never from a hardcoded default:
      # the CLI otherwise assumes 1.0.0 and every release after the first
      # collides with it. This runs before checkout because the tag is the
      # checkout ref.
      - name: Resolve version from the release tag
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          TAG="${INPUT_TAG}"
          if [ -z "${TAG}" ]; then
            TAG="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          fi

          # The registry stores whatever is passed, so refuse anything that is
          # not a semver release tag instead of publishing a bogus version.
          if ! printf '%s' "${TAG}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'${TAG}' is not a vX.Y.Z release tag"
            exit 1
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Publishing code-crawler at ${TAG}"

      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Publish skill
        shell: bash
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          if [ -z "${CLAWHUB_TOKEN}" ]; then
            echo "::notice::CLAWHUB_TOKEN is not set; skipping the ClawHub publish."
            exit 0
          fi

          # The CLI authenticates from a config file (CLAWHUB_CONFIG_PATH), not
          # from CLAWHUB_TOKEN directly. Keep the token out of the command line,
          # and build the JSON with Node so no shell escaping can corrupt it.
          CONFIG="${RUNNER_TEMP}/clawhub-config.json"
          umask 077
          trap 'rm -f "${CONFIG}"' EXIT
          node -e '
            const fs = require("node:fs");
            fs.writeFileSync(
              process.argv[1],
              JSON.stringify({
                registry: "https://clawhub.ai",
                token: process.env.CLAWHUB_TOKEN,
              }) + "\n",
            );
          ' "${CONFIG}"
          export CLAWHUB_CONFIG_PATH="${CONFIG}"

          # Commit of the checked-out tag, which is not GITHUB_SHA on a manual
          # dispatch from a branch.
          SOURCE_COMMIT="$(git rev-parse HEAD)"

          ARGS=(
            skill publish ./skills/code-crawler
            --slug code-crawler
            --name "Code Crawler"
            --owner nithin554
            --version "${VERSION}"
            --categories development
            --topics "code-analysis,call-graph,static-analysis,mcp,dead-code"
            --changelog "Release ${TAG}"
            --source-repo "${GITHUB_REPOSITORY}"
            --source-commit "${SOURCE_COMMIT}"
            --source-ref "${TAG}"
          )

          # Always validate first; a bad SKILL.md should fail before it ships.
          npx -y clawhub@latest "${ARGS[@]}" --dry-run

          if [ "${DRY_RUN}" = "true" ]; then
            echo "::notice::Dry run requested; not publishing to ClawHub."
            exit 0
          fi

          # The registry answers a burst of writes with a rate-limit error and
          # tells the caller when it resets, so a single attempt turns an
          # ordinary throttle into a failed release. Retry with a backoff that
          # outlasts the advertised reset. A re-run of a tag whose publish
          # partially succeeded must also not fail on the version that is
          # already there.
          for attempt in 1 2 3; do
            if OUTPUT="$(npx -y clawhub@latest "${ARGS[@]}" 2>&1)"; then
              printf '%s\n' "${OUTPUT}"
              exit 0
            fi

            printf '%s\n' "${OUTPUT}"
            if printf '%s' "${OUTPUT}" | grep -qi "already exists"; then
              echo "::notice::code-crawler@${VERSION} is already on ClawHub; nothing to publish."
              exit 0
            fi

            if [ "${attempt}" -ge 3 ]; then
              break
            fi
            if ! printf '%s' "${OUTPUT}" | grep -qiE "too many writes|rate.?limit|try again|429"; then
              break
            fi

            DELAY=$((attempt * 45))
            echo "::warning::ClawHub throttled the publish (attempt ${attempt}); retrying in ${DELAY}s"
            sleep "${DELAY}"
          done

          echo "::error::ClawHub rejected code-crawler@${VERSION}"
          exit 1
