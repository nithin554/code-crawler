name: Publish Skill to ClawHub

# Publishes skills/code-crawler to clawhub.ai whenever the skill changes.
# Requires a CLAWHUB_TOKEN repository secret (`clawhub login` then `clawhub token`).
# Without the secret the job reports a notice and exits successfully, so forks
# and fresh clones are not broken by a missing credential.

on:
  push:
    branches:
      - "main"
    paths:
      - "skills/code-crawler/**"
      - ".github/workflows/publish-clawhub.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate the skill without publishing it"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: clawhub-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Publish skill
        shell: bash
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          set -euo pipefail

          if [ -z "${CLAWHUB_TOKEN}" ]; then
            echo "::notice::CLAWHUB_TOKEN is not set; skipping the ClawHub publish."
            exit 0
          fi

          # The CLI authenticates from a config file (CLAWHUB_CONFIG_PATH), not
          # from CLAWHUB_TOKEN directly. Keep the token out of the command line.
          CONFIG="${RUNNER_TEMP}/clawhub-config.json"
          printf '{"registry":"https://clawhub.ai","token":"%s"}\n' "${CLAWHUB_TOKEN}" > "${CONFIG}"
          export CLAWHUB_CONFIG_PATH="${CONFIG}"

          ARGS=(
            skill publish ./skills/code-crawler
            --slug code-crawler
            --name "Code Crawler"
            --owner nithin554
            --categories development
            --topics "code-analysis,call-graph,static-analysis,mcp,dead-code"
            --changelog "Sync skills/code-crawler from ${GITHUB_SHA::7}"
          )

          # Always validate first; a bad SKILL.md should fail before it ships.
          npx -y clawhub@latest "${ARGS[@]}" --dry-run

          if [ "${DRY_RUN}" = "true" ]; then
            echo "::notice::Dry run requested; not publishing to ClawHub."
            exit 0
          fi

          npx -y clawhub@latest "${ARGS[@]}"
