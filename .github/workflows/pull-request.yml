name: Build & Test
on:
  pull_request:
    branches:
      - "**"

jobs:
  build-and-test:
    name: build-and-test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check generated docs
        run: npm run docs:check

      - name: Run tests
        run: npm test

      - name: Coverage
        if: matrix.node-version == '22'
        run: npm run coverage

      - name: Build
        run: npm run build

      - name: Smoke-test built CLI
        run: |
          node dist/index.js help
          CODECRAWLER_DB="$(mktemp -u).db" node dist/index.js status

  # Accuracy, not just correctness. Crawls the pinned projects in benchmarks/manifest.json,
  # scores the graph against hand-verified ground truth and fails if precision or recall drops
  # below the floors recorded there. Run locally with `npm run bench:accuracy`.
  accuracy:
    name: accuracy benchmark
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache pinned benchmark checkouts
        uses: actions/cache@v4
        with:
          path: benchmarks/.cache
          key: accuracy-checkouts-${{ hashFiles('benchmarks/manifest.json') }}

      - name: Run accuracy benchmark
        run: npm run bench:accuracy

      - name: Run runtime dispatch check
        run: npm run bench:runtime

      - name: Upload accuracy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: accuracy-report
          path: benchmarks/reports/