name: Build & Test
on:
  pull_request:
    branches:
      - "**"

jobs:
  build-and-test:
    name: build-and-test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Coverage
        if: matrix.node-version == '22'
        run: npm run coverage

      - name: Build
        run: npm run build

      - name: Smoke-test built CLI
        run: |
          node dist/index.js help
          CODECRAWLER_DB="$(mktemp -u).db" node dist/index.js status